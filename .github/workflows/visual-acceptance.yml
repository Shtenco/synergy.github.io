name: Visual acceptance — Chromium
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'portal/**'
      - 'assets/syn26.css'
      - 'assets/synergy-capital-model.js'
      - 'assets/synergy-conversion.css'
      - 'assets/synergy-conversion.js'
      - 'assets/synergy-home-v2.css'
      - 'assets/synergy-capital-mc.css'
      - 'smm/**'
      - 'investor/**'
      - 'investor-folio/**'
      - 'broker-mesh/**'
      - 'scripts/visual_acceptance.py'
      - 'scripts/audit_smm_methods.py'
      - '.github/workflows/visual-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Start static server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          sleep 2
      - name: Screenshot and viewport checks
        run: python scripts/visual_acceptance.py
      - name: Exhaustive SMM method navigation and control checks
        if: always()
        run: python scripts/audit_smm_methods.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synergy-visual-acceptance
          path: visual-acceptance-results/
          retention-days: 14
